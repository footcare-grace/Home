<body>

<nav class="nav" id="siteNav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html"><img src="logo.png" alt="トータルフットケア GRACE"></a>
    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>

    <div class="nav-links" id="navLinks">

  </div>
</nav>

<section class="subpage-hero">
  <div class="wrap">
    <div class="en">Policy</div>
    <div class="jp">キャンセルポリシー</div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="subpage-body">
      <div class="policy-note" style="max-width:100%; margin-top:0;">
        <h4>ご予約の変更・キャンセルについて</h4>
        <p>ご予約の変更・キャンセルは、施術前日の20:00までに公式LINEにてご連絡ください。</p>
        <p>前日20:00以降のご変更・キャンセルは施術料金の50%、当日キャンセル・無断キャンセルの場合は100%を、キャンセル料として頂戴する場合がございます。</p>

      </div>

<footer>
  <div class="wrap">
    <img class="footer-logo-img" src="logo.png" alt="トータルフットケア GRACE">
    <div class="footer-copy">&copy; 2026 トータルフットケア GRACE</div>
  </div>
</footer>

<script>
(function(){
  var nav = document.getElementById('siteNav');
  var toggle = document.getElementById('navToggle');
  var links = document.getElementById('navLinks');
  if(!nav || !toggle || !links) return;
  toggle.addEventListener('click', function(){
    var open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  links.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      nav.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
</body>
</html>
